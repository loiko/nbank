name: Run Tests

on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Cache Maven repositories
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Services
        run: cd infra/docker_compose && bash restart_docker.sh && cd ../..

      - name: Debug browser view
        run: |
          echo "=== Start a test browser session ==="
          SESSION_RESPONSE=$(curl -X POST http://localhost:4444/wd/hub/session \
            -H "Content-Type: application/json" \
            -d '{
              "desiredCapabilities": {
                "browserName": "chrome",
                "version": "91.0"
              }
            }')

          echo "Session response: $SESSION_RESPONSE"

          SESSION_ID=$(echo $SESSION_RESPONSE | jq -r '.sessionId')
          echo "Session ID: $SESSION_ID"

          echo "=== Navigate to frontend ==="
          curl -X POST "http://localhost:4444/wd/hub/session/$SESSION_ID/url" \
            -H "Content-Type: application/json" \
            -d '{"url": "http://frontend"}'

          sleep 3

          echo "=== Get page source ==="
          PAGE_SOURCE=$(curl -s "http://localhost:4444/wd/hub/session/$SESSION_ID/source" | jq -r '.value')
          echo "$PAGE_SOURCE" | head -50

          echo "=== Get current URL ==="
          curl -s "http://localhost:4444/wd/hub/session/$SESSION_ID/url" | jq .

          echo "=== Delete session ==="
          curl -X DELETE "http://localhost:4444/wd/hub/session/$SESSION_ID"

      - name: Run Tests
        run: ./mvnw clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend:80
          UIREMOTE: http://localhost:4444/wd/hub/
          DB_URL: jdbc:postgresql://localhost:5433/nbank
          DB_USERNAME: postgres
          DB_PASSWORD: postgres