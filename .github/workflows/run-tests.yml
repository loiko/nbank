name: Run Tests

on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Cache Maven repositories
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Services
        run: cd infra/docker_compose && bash restart_docker.sh && cd ../..

      - name: Get runner IP and test connectivity
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "Runner IP: $RUNNER_IP"
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          
          echo "Waiting for frontend..."
          sleep 5
          curl -I http://localhost:8080 || echo "Frontend not accessible on localhost:8080"
          curl -I http://$RUNNER_IP:8080 || echo "Frontend not accessible on $RUNNER_IP:8080"

      - name: Run Tests
        run: ./mvnw clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://${{ env.RUNNER_IP }}:8080
          UIREMOTE: http://localhost:4444/wd/hub/
          DB_URL: jdbc:postgresql://localhost:5433/nbank
          DB_USERNAME: postgres
          DB_PASSWORD: postgres