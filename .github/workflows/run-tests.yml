name: Run Tests

on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Cache Maven repositories
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Services
        run: cd infra/docker_compose && bash restart_docker.sh && cd ../..

      - name: Debug Selenoid
        run: |
          echo "=== Selenoid container status ==="
          docker ps | grep selenoid
          
          echo "=== Selenoid logs ==="
          docker logs $(docker ps -q -f name=selenoid) 2>&1 | tail -50
          
          echo "=== Selenoid /status endpoint ==="
          curl -s http://localhost:4444/status || echo "Selenoid not responding"
          
          echo "=== Available browser images ==="
          docker images | grep selenoid
          
          echo "=== browsers.json content ==="
          cat infra/docker_compose/config/browsers.json

      - name: Test Selenoid manually
        run: |
          echo "=== Try to create a session in Selenoid ==="
          curl -X POST http://localhost:4444/wd/hub/session \
          -H "Content-Type: application/json" \
          -d '{
          "desiredCapabilities": {
          "browserName": "chrome",
          "version": "91.0"
            }
          }' || echo "Failed to create session"
    
          echo ""
          echo "=== Check Selenoid logs after session attempt ==="
          docker logs docker_compose-selenoid-1 2>&1 | tail -20
    
          echo ""
          echo "=== Check if browser container started ==="
          docker ps -a | grep chrome || echo "No chrome container found"

      - name: Test network connectivity
        run: |
          echo "=== Check if frontend is accessible ==="
          curl -I http://localhost:80 || echo "Frontend not accessible from host"

          echo "=== Check frontend container ==="
          docker logs docker_compose-frontend-1 --tail 20

          echo "=== Test from inside Selenoid network ==="
          docker run --rm --network nbank-network alpine/curl:latest curl -I http://frontend || echo "Frontend not accessible from Docker network"

          echo "=== Check what page browser sees ==="
          BROWSER_CONTAINER=$(docker ps -q -f ancestor=selenoid/vnc:chrome_91.0 | head -1)
          if [ -n "$BROWSER_CONTAINER" ]; then
            docker exec $BROWSER_CONTAINER curl -s http://frontend | head -20 || echo "Cannot reach frontend"
          fi

      - name: Run Tests
        run: ./mvnw clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend:80
          UIREMOTE: http://localhost:4444/wd/hub/
          DB_URL: jdbc:postgresql://localhost:5433/nbank
          DB_USERNAME: postgres
          DB_PASSWORD: postgres