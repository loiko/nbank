apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenoid
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: selenoid
  template:
    metadata:
      labels:
        app: selenoid
    spec:
      initContainers:
        - name: wait-for-frontend
          image: busybox:1.28
          command: [ 'sh', '-c', 'until nc -z frontend 80; do echo waiting for frontend; sleep 2; done;' ]
      containers:
        - name: selenoid
          image: {{ .Values.selenoid.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["-container-network", "nbank-network"]
          ports:
            - containerPort: {{ .Values.selenoid.port }}
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: selenoid-config
              mountPath: /etc/selenoid
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: selenoid-config
          configMap:
            name: selenoid-config
---
apiVersion: v1
kind: Service
metadata:
  name: selenoid
spec:
  selector:
    app: selenoid
  ports:
    - protocol: TCP
      port: {{ .Values.selenoid.port }}
      targetPort: {{ .Values.selenoid.port }}
      nodePort: {{ .Values.selenoid.nodePort }}
  type: NodePort